<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<meta name="theme-color" content="#121722">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Piano alimentare</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="recap" aria-live="polite"></header>
<main id="view"></main>
<nav id="tabbar" aria-label="Sezioni">
  <button data-tab="oggi" aria-label="Oggi">
    <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z" opacity="0"/><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Oggi
  </button>
  <button data-tab="consigli" aria-label="Consigli">
    <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.4 1.1 2.2h5c0-.8.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>Consigli
  </button>
  <button data-tab="storico" aria-label="Storico">
    <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Storico
  </button>
  <button data-tab="peso" aria-label="Peso">
    <svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 5-8 4 5"/><path d="M3 21h18"/></svg>Peso
  </button>
  <button data-tab="altro" aria-label="Altro">
    <svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>Altro
  </button>
</nav>
<div id="sheets"></div>
<button id="fab" aria-label="Aggiungi alimento"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="toast"></div>
<noscript><p style="padding:90px 20px;color:#fff">Serve JavaScript per usare l'app.</p></noscript>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
